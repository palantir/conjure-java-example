buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.palantir.baseline-error-prone:gradle-baseline-error-prone:0.26.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:7.8.0'
        classpath 'com.palantir.gradle.conjure:gradle-conjure:6.3.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.18.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:1.37.0'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.20.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:5.1.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.11.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.82.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.32.0'
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.6.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.97.0'
        classpath 'com.palantir.launchconfig:gradle-launch-config-plugin:1.5.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.31.0'
    }
}

apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.baseline-error-prone-root'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.external-publish'
apply plugin: 'com.palantir.failure-reports'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.jdks'
apply plugin: 'com.palantir.jdks.latest'

version gitVersion()

allprojects {
    apply plugin: 'com.palantir.jakarta-package-alignment'
    apply plugin: 'java-library'
    apply plugin: 'com.palantir.java-format'

    version rootProject.version
    group 'com.palantir.conjure.examples'

    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }
}

configure(subprojects - project(':recipe-example-api')) {
    apply plugin: 'java'

    tasks.withType(JavaCompile) {
        options.compilerArgs += ['-Werror']
    }

    tasks.check.dependsOn checkUnusedDependencies
}

javaVersions {
    javaCompiler = 25
    libraryTarget = 17
    runtime = 25
}

jdks {
    daemonTarget = 21
}
